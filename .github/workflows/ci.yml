name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The migration manifest test compares with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run smoke
  agents-doctor:
    # Checks the shared agent kit: AGENTS.md as the guide, CLAUDE.md importing
    # it, one skills folder, valid .agents policy files, the PR template,
    # CODEOWNERS and the skill adapter. No path filter, so a gate can depend on
    # it. Pinned to a guild commit; doctor-ref matches, so the workflow and the
    # doctor script it runs come from the same commit.
    uses: greenpill-dev-guild/.github/.github/workflows/agents-doctor.yml@d5bab15ee152be8fe289257826b28655090e4d05
    with:
      mode: ci
      doctor-ref: d5bab15ee152be8fe289257826b28655090e4d05
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.11.0.011
        env:
          POSTGRES_PASSWORD: synthetic-local-test
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: supabase_admin
      PGDATABASE: regen_test
      PGPASSWORD: synthetic-local-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply migrations to disposable Postgres
        run: |
          PGDATABASE=postgres psql -v ON_ERROR_STOP=1 \
            -c "create role weave_migration_owner login createrole nosuperuser nobypassrls password 'synthetic-local-test'" \
            -c 'create database regen_test owner weave_migration_owner template template0'
          psql -v ON_ERROR_STOP=1 \
            -c 'create schema extensions authorization weave_migration_owner' \
            -c 'create extension vector with schema extensions'
          PGUSER=weave_migration_owner psql -v ON_ERROR_STOP=1 -f supabase/tests/local-auth.sql
          for migration in supabase/migrations/*.sql; do
            PGUSER=weave_migration_owner psql -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Run every SQL suite
        # Each file in supabase/tests runs, so a new suite needs no workflow
        # edit. local-auth.sql is the auth stub applied before the migrations.
        run: |
          shopt -s nullglob
          suites=(supabase/tests/*.sql)
          ran=0
          for suite in "${suites[@]}"; do
            [ "$(basename "$suite")" = local-auth.sql ] && continue
            echo "::group::$suite"
            psql -v ON_ERROR_STOP=1 -f "$suite"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "Ran $ran SQL suites"
          [ "$ran" -gt 0 ]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify synthetic Notion import and replay
        env:
          REGEN_IMPORT_SQL_TEST: synthetic-local-only
        run: node scripts/verify-notion-import-replay.js
  ci-gate:
    # The single required check. It passes only when every gated job passed,
    # so a red, cancelled or skipped job blocks the merge.
    if: always()
    needs: [check, database, agents-doctor]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gated job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | length == 3 and all(.value.result == "success")' > /dev/null
