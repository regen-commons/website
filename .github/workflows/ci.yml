name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run smoke
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.11.0.011
        env:
          POSTGRES_PASSWORD: synthetic-local-test
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: supabase_admin
      PGDATABASE: regen_test
      PGPASSWORD: synthetic-local-test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to disposable Postgres
        run: |
          PGDATABASE=postgres psql -v ON_ERROR_STOP=1 \
            -c "create role weave_migration_owner login createrole nosuperuser nobypassrls password 'synthetic-local-test'" \
            -c 'create database regen_test owner weave_migration_owner template template0'
          psql -v ON_ERROR_STOP=1 \
            -c 'create schema extensions authorization weave_migration_owner' \
            -c 'create extension vector with schema extensions'
          PGUSER=weave_migration_owner psql -v ON_ERROR_STOP=1 -f supabase/tests/local-auth.sql
          for migration in supabase/migrations/*.sql; do
            PGUSER=weave_migration_owner psql -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
      - name: Verify steward and public data boundaries
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/steward-access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/content-access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/feedback-access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/contact-access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/notification-access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/membership-access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/decision-email-access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/weave-private-access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/weave-workspace-context.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/email-delivery-outcomes.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify synthetic Notion import and replay
        env:
          REGEN_IMPORT_SQL_TEST: synthetic-local-only
        run: node scripts/verify-notion-import-replay.js
