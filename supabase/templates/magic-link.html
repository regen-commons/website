<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Regen Commons sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#EDE5D4;">
    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#EDE5D4" style="width:100%;border-collapse:collapse;background-color:#EDE5D4;">
      <tr>
        <td align="center" valign="top" style="padding:32px 16px;">
          <!--[if mso]><table role="presentation" width="560" border="0" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
          <table role="presentation" width="100%" border="0" cellpadding="24" cellspacing="0" style="width:100%;max-width:560px;border-collapse:collapse;">
            <tr>
              <td align="left" style="padding:32px 24px;color:#1A1408;font-family:Georgia,'Times New Roman',serif;">
                <p style="margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;letter-spacing:2px;color:#1E3A10;">REGEN COMMONS</p>
                <h1 style="margin:0 0 20px;font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:38px;font-weight:400;color:#1A1408;">Your steward sign-in code</h1>
                <p style="margin:0 0 24px;font-size:18px;line-height:28px;color:#1A1408;">Enter this code in the steward desk to sign in:</p>
                <table role="presentation" width="100%" border="0" cellpadding="20" cellspacing="0" style="width:100%;border-collapse:collapse;">
                  <tr>
                    <td align="center" bgcolor="#E0D6C0" style="padding:20px 12px;border:1px solid #4A3E2C;background-color:#E0D6C0;color:#1A1408;font-family:'Courier New',Courier,monospace;font-size:28px;line-height:36px;letter-spacing:4px;">{{ .Token }}</td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:16px;line-height:26px;color:#1A1408;">This code is single use and expires in one hour. If you didn't request it, you can ignore this email.</p>
                <p style="margin:28px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:21px;color:#4A3E2C;">Regen Commons · A living network, tended together.</p>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
